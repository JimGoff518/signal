{% extends "base.html" %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="flex items-center justify-center gap-2.5 font-display text-2xl font-semibold tracking-wide mb-1">
        <span class="inline-block w-3 h-3 rounded-full bg-signal shadow-[0_0_12px_rgba(251,113,133,0.7)]" aria-hidden="true"></span>
        <span translate="no">SIGNAL</span>
      </div>
      <p class="text-sm text-zinc-500">Class action · Product liability · Goff Law PLLC</p>
    </div>

    <form method="post" action="/login" class="space-y-4 card p-6">
      <div>
        <label class="field-label" for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" spellcheck="false" class="field" required autofocus />
      </div>
      <div>
        <label class="field-label" for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" class="field" required />
      </div>
      {% if error %}
      <div class="text-sm text-rose-300" role="alert">That username and password don't match. Check both and try again.</div>
      {% endif %}
      <button type="submit" class="btn-primary w-full">Sign in</button>
    </form>

    <p class="text-xs text-zinc-500 text-center mt-6">Confidential · authorized users only</p>
  </div>
</div>
{% endblock %}
